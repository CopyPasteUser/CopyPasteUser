name: Refresh profile activity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-activity.yml"
      - "scripts/update_activity.py"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'CopyPasteUser/CopyPasteUser'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate image from GitHub contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Commit updated image
        run: |
          if git diff --quiet -- assets/github-activity.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git commit -m "chore(profile): refresh contribution graphic"
          git push
